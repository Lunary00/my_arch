general {
    immediate_render = true
    hide_cursor = true

    # Tempo do fade (em milissegundos). 350 deixa mais suave que o padrão (300).
    # Se ainda achar lento, diminua para 250.
    fade_out_interval = 350
    fade_in_interval = 350
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg   # ← seu wallpaper
    blur_passes = 1                        # ↓ reduzido para 1 (era 2) para ser mais rápido
    blur_size = 5                          # mantido
    color = rgba(0, 0, 0, 0.4)            # Fundo preto semi-transparente aparece instantaneamente
}

clock {
    monitor =
    format = %H:%M
    time_format = 24
    font_color = rgb(255, 255, 255)
    font_size = 80
    position = 0, 150
    halign = center
    valign = center
}

clock {
    monitor =
    format = %A, %d de %B de %Y
    font_color = rgb(200, 200, 200)
    font_size = 20
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.4
    font_color = rgb(255, 255, 255)
    inner_color = rgba(0, 0, 0, 0.3)
    outer_color = rgba(255, 255, 255, 0.5)
    position = 0, -80
    halign = center
    valign = center
    fade_on_empty = true
    placeholder_text = Digite a senha...
}
